packages:
  - "apps/*"
  - "packages/*"

overrides:
  # GHSA-fxqj-rqcc-2cmp — incomplete fix of GHSA-6g55-p6wh-862q, attacker-controlled
  # sourceMappingURL can read arbitrary .map files when `from` is unset. Fixed in 8.5.23.
  postcss: "^8.5.23"
  # next@16.2.12's optional sharp dependency (0.34.5) has 4 HIGH libvips CVEs
  # (GHSA-f88m-g3jw-g9cj) fixed in 0.35.0 — force the patched version.
  sharp: "^0.35.3"
  # Transitive via minimatch (eslint/glob toolchain) at two major versions —
  # both had a HIGH DoS via unbounded expansion (GHSA-v6h2-p8h4-qcjw), fixed
  # in 1.1.17 / 5.0.8 respectively. Not a runtime dependency of the app.
  brace-expansion@1: "^1.1.17"
  brace-expansion@5: "^5.0.8"
  # GHSA-2v37-7h3g-55p8 — custom generators can loop indefinitely when size is
  # zero. Fixed in 3.3.17. Transitive via postcss/next.
  nanoid: "^3.3.17"
  # GHSA-5p4m-2wfm-xmqj / CVE-2026-59870 — quadratic CPU consumption in
  # !!omap resolution, fix from 3.x not backported to 4.x. Fixed in 4.3.1.
  # Transitive via eslint's @eslint/eslintrc.
  js-yaml: "^4.3.1"

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@next/env@16.2.12'
  - '@next/eslint-plugin-next@16.2.12'
  - '@next/swc-darwin-arm64@16.2.12'
  - '@next/swc-darwin-x64@16.2.12'
  - '@next/swc-linux-arm64-gnu@16.2.12'
  - '@next/swc-linux-arm64-musl@16.2.12'
  - '@next/swc-linux-x64-gnu@16.2.12'
  - '@next/swc-linux-x64-musl@16.2.12'
  - '@next/swc-win32-arm64-msvc@16.2.12'
  - '@next/swc-win32-x64-msvc@16.2.12'
  - eslint-config-next@16.2.12
  - next@16.2.12
